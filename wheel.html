<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>S型彎練習 - 手機方向盤控制器</title>
    <link rel="stylesheet" href="css/wheel.css">
    <!-- PeerJS 免費點對點 WebRTC 函式庫 -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="js/webrtc.js"></script>
    <script src="js/wheel.js"></script>
</head>
<body>
    <div id="wheel-app">
        <!-- 頂部超薄狀態儀表列 -->
        <header class="top-status-bar">
            <div class="conn-badge">
                <span id="conn-dot" class="conn-dot"></span>
                <span id="conn-text">連線中...</span>
            </div>
            <div id="turns-badge" class="turns-badge straight">
                已回正 (0.0 圈)
            </div>
            <div id="gear-indicator-pill" class="gear-indicator-pill P">
                P 檔 (停車)
            </div>
        </header>

        <!-- 橫向專屬 3 欄式主控面板 (完全適配 Safari 橫屏不裁切) -->
        <main class="landscape-dashboard">
            <!-- 左欄：排檔桿 (P/D/R) 與 智慧煞車踏板 -->
            <section class="dash-col col-left">
                <div class="gear-group">
                    <button id="btn-gear-p" class="btn-gear active P" data-gear="P">P 檔</button>
                    <button id="btn-gear-d" class="btn-gear D" data-gear="D">D 檔</button>
                    <button id="btn-gear-r" class="btn-gear R" data-gear="R">R 檔</button>
                </div>

                <!-- 智慧煞車踏板 (按一下煞停鎖定 / 再按一次怠速滑行，亦支援長按) -->
                <button id="brake-pedal" class="brake-pedal auto-held">
                    <span class="pedal-icon">🛑</span>
                    <span class="pedal-title">煞 車</span>
                    <span id="pedal-sub-text" class="pedal-sub">已煞停 (點擊出發)</span>
                </button>
            </section>

            <!-- 中欄：虛擬方向盤本體 (支援陀螺儀與滑動) -->
            <section class="dash-col col-center">
                <div class="wheel-container">
                    <div id="virtual-wheel" class="virtual-wheel">
                        <div class="wheel-top-marker"></div>
                        <div class="spoke-h"></div>
                        <div class="spoke-v"></div>
                        <div class="wheel-hub">
                            <span class="hub-label">1.5 圈</span>
                            <span class="hub-sub">540°</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 右欄：快捷功能鍵 (體感陀螺儀、校準歸零、重置回起點) -->
            <section class="dash-col col-right">
                <button id="btn-enable-gyro" class="btn-action">
                    <span class="btn-icon">📱</span>
                    <span class="btn-txt">啟用體感陀螺儀</span>
                </button>
                <button id="btn-calibrate" class="btn-action">
                    <span class="btn-icon">🎯</span>
                    <span class="btn-txt">方向盤校準 (0°)</span>
                </button>
                <button id="btn-reset" class="btn-action danger">
                    <span class="btn-icon">🔄</span>
                    <span class="btn-txt">重置回起點</span>
                </button>
            </section>
        </main>
    </div>
</body>
</html>
